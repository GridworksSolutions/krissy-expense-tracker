<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>Krissy Expense Tracker</title>

    <!-- PWA -->
    <link
        rel="manifest"
        href="./manifest.json"
    >

    <!-- iPhone / iPad -->
    <link
        rel="apple-touch-icon"
        href="./icon-192.png"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Expenses"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        .app {
            max-width: 520px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
        }

        .header {
            background: #111827;
            color: white;
            padding: 28px 22px 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            margin: 7px 0 0;
            color: #d1d5db;
            font-size: 14px;
        }

        .form-container {
            padding: 24px 20px 40px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #111827;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .amount-wrapper {
            position: relative;
        }

        .currency {
            position: absolute;
            left: 14px;
            top: 15px;
            font-weight: bold;
        }

        #amount {
            padding-left: 45px;
        }

        .photo-box {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: #f8fafc;
        }

        /*
            Hide the actual file inputs.
            The styled labels below act as the buttons.
        */
        #receiptCamera,
        #receiptGallery {
            display: none;
        }

        .photo-button {
            display: block;
            background: #e5e7eb;
            padding: 14px;
            border-radius: 9px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .photo-button:active {
            transform: scale(0.99);
        }

        #photoStatus {
            margin: 12px 0 0;
            font-size: 13px;
            color: #6b7280;
        }

        #photoPreview {
            display: none;
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 10px;
            background: white;
        }

        .submit-button {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 16px;
            background: #111827;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-button:active {
            transform: scale(0.99);
        }


        /* ----------------------------------------
           MICROSOFT SIGN-IN
           ---------------------------------------- */

        .auth-box {
            margin-bottom: 22px;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f8fafc;
        }

        .auth-status {
            margin: 0 0 10px;
            font-size: 14px;
            color: #4b5563;
        }

        .auth-button {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 13px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-button:active {
            transform: scale(0.99);
        }

        .required {
            color: #dc2626;
        }

    </style>

</head>

<body>

    <div class="app">

        <header class="header">

            <h1>Expense Tracker</h1>

            <p>
                Record a new transaction
            </p>

        </header>

        <main class="form-container">


            <!-- Microsoft Sign-In -->
            <div class="auth-box">

                <p
                    id="authStatus"
                    class="auth-status"
                >
                    Checking Microsoft sign-in...
                </p>

                <button
                    id="signInButton"
                    class="auth-button"
                    type="button"
                    disabled
                >
                    Sign in with Microsoft
                </button>

            </div>

            <form id="expenseForm">

                <!-- Date -->
                <div class="field">

                    <label for="transactionDate">
                        Date
                        <span class="required">*</span>
                    </label>

                    <input
                        type="date"
                        id="transactionDate"
                        required
                    >

                </div>


                <!-- Transaction Type -->
                <div class="field">

                    <label for="transactionType">
                        Transaction Type
                        <span class="required">*</span>
                    </label>

                    <select
                        id="transactionType"
                        required
                    >

                        <option value="">
                            Select transaction type
                        </option>

                        <option value="ACH">
                            ACH
                        </option>

                        <option value="Petty Cash">
                            Petty Cash
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Paid By -->
                <div class="field">

                    <label for="paidBy">
                        Paid By
                    </label>

                    <input
                        type="text"
                        id="paidBy"
                        placeholder="Who paid for this expense?"
                    >

                </div>


                <!-- Description -->
                <div class="field">

                    <label for="description">
                        Description
                        <span class="required">*</span>
                    </label>

                    <textarea
                        id="description"
                        placeholder="What was this expense for?"
                        required
                    ></textarea>

                </div>


                <!-- Amount -->
                <div class="field">

                    <label for="amount">
                        Amount
                        <span class="required">*</span>
                    </label>

                    <div class="amount-wrapper">

                        <span class="currency">
                            TT$
                        </span>

                        <input
                            type="number"
                            id="amount"
                            min="0"
                            step="0.01"
                            placeholder="0.00"
                            inputmode="decimal"
                            required
                        >

                    </div>

                </div>


                <!-- Receipt Photo -->
                <div class="field">

                    <label>
                        Receipt Photo
                    </label>

                    <div class="photo-box">

                        <!--
                            capture="environment" asks a mobile browser
                            to use the rear-facing camera.
                        -->
                        <label
                            for="receiptCamera"
                            class="photo-button"
                        >
                            📷 Take Receipt Photo
                        </label>

                        <input
                            type="file"
                            id="receiptCamera"
                            accept="image/*"
                            capture="environment"
                        >


                        <!-- Existing image / gallery -->
                        <label
                            for="receiptGallery"
                            class="photo-button"
                        >
                            🖼️ Choose Existing Photo
                        </label>

                        <input
                            type="file"
                            id="receiptGallery"
                            accept="image/*"
                        >


                        <p id="photoStatus">
                            No photo selected
                        </p>


                        <img
                            id="photoPreview"
                            alt="Receipt preview"
                        >

                    </div>

                </div>


                <!-- Submit -->
                <button
                    class="submit-button"
                    type="submit"
                >
                    Save Transaction
                </button>

            </form>

        </main>

    </div>


    <script type="module">

        /*
            ----------------------------------------
            MICROSOFT AUTHENTICATION
            ----------------------------------------

            This PWA is a browser-based Single Page
            Application (SPA), so Microsoft sign-in
            is handled with MSAL Browser.

            Azure App Registration:
            - Client ID: identifies Krissy Expense App
            - Tenant ID: limits sign-in to our directory
            - Redirect URI: this GitHub Pages app
        */

        import {
            PublicClientApplication
        } from "https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.21.0/+esm";


        const CLIENT_ID =
            "101997fe-3604-41fb-afbf-018a473cd5f0";

        const TENANT_ID =
            "76acc7c5-be30-41ce-ace7-aec2b8b960c8";

        const REDIRECT_URI =
            "https://gridworkssolutions.github.io/krissy-expense-tracker/";


        const msalConfig = {

            auth: {

                clientId: CLIENT_ID,

                authority:
                    "https://login.microsoftonline.com/" +
                    TENANT_ID,

                redirectUri: REDIRECT_URI,

                postLogoutRedirectUri:
                    REDIRECT_URI

            },

            cache: {

                /*
                    localStorage keeps the sign-in
                    available when the PWA/browser is
                    closed and reopened.
                */
                cacheLocation: "localStorage"

            }

        };


        const loginRequest = {

            /*
                User.Read identifies the signed-in
                Microsoft account.

                Files.ReadWrite allows this PWA to
                upload receipt images to the signed-in
                user's OneDrive.
            */
            scopes: [
                "User.Read",
                "Files.ReadWrite"
            ]

        };


        const msalInstance =
            new PublicClientApplication(msalConfig);


        const authStatus =
            document.getElementById("authStatus");

        const signInButton =
            document.getElementById("signInButton");


        function showSignedIn(account) {

            authStatus.textContent =
                "Signed in as " +
                (account.name ||
                 account.username ||
                 "Microsoft user");

            signInButton.textContent =
                "Microsoft account connected";

            signInButton.disabled =
                true;

        }


        function showSignedOut() {

            authStatus.textContent =
                "Microsoft account not connected";

            signInButton.textContent =
                "Sign in with Microsoft";

            signInButton.disabled =
                false;

        }


        async function startMicrosoftAuth() {

            try {

                /*
                    MSAL v5 must be initialized before
                    any other MSAL API is called.
                */
                await msalInstance.initialize();


                /*
                    Required on every page load when
                    using redirect-based sign-in.
                    If Microsoft has just redirected
                    back to us, this completes login.
                */
                const redirectResult =
                    await msalInstance
                        .handleRedirectPromise();


                if (redirectResult?.account) {

                    msalInstance.setActiveAccount(
                        redirectResult.account
                    );

                    showSignedIn(
                        redirectResult.account
                    );

                    return;

                }


                /*
                    If the user previously signed in,
                    MSAL may already have the account
                    in its local cache.
                */
                const accounts =
                    msalInstance.getAllAccounts();


                if (accounts.length > 0) {

                    msalInstance.setActiveAccount(
                        accounts[0]
                    );

                    showSignedIn(
                        accounts[0]
                    );

                }
                else {

                    showSignedOut();

                }

            }
            catch (error) {

                console.error(
                    "Microsoft authentication error:",
                    error
                );

                authStatus.textContent =
                    "Microsoft sign-in could not be initialized.";

                signInButton.textContent =
                    "Try Microsoft sign-in again";

                signInButton.disabled =
                    false;

            }

        }


        signInButton.addEventListener(
            "click",
            async function () {

                signInButton.disabled =
                    true;

                authStatus.textContent =
                    "Opening Microsoft sign-in...";

                try {

                    await msalInstance.loginRedirect(
                        loginRequest
                    );

                }
                catch (error) {

                    console.error(
                        "Microsoft sign-in failed:",
                        error
                    );

                    authStatus.textContent =
                        "Microsoft sign-in failed. Please try again.";

                    signInButton.disabled =
                        false;

                }

            }
        );


        /*
            Start authentication as soon as the
            page's JavaScript is ready.
        */
        startMicrosoftAuth();


        /*
            ----------------------------------------
            MICROSOFT GRAPH / ONEDRIVE
            ----------------------------------------
        */

        const GRAPH_SCOPES = [
            "User.Read",
            "Files.ReadWrite"
        ];


        async function getGraphAccessToken() {

            const account =
                msalInstance.getActiveAccount() ||
                msalInstance.getAllAccounts()[0];


            if (!account) {

                throw new Error(
                    "Please sign in with Microsoft first."
                );

            }


            try {

                /*
                    Normal case: MSAL gets a valid token
                    silently from its cache and refreshes
                    it when necessary.
                */
                const tokenResult =
                    await msalInstance
                        .acquireTokenSilent({
                            scopes: GRAPH_SCOPES,
                            account: account
                        });

                return tokenResult.accessToken;

            }
            catch (error) {

                console.warn(
                    "Silent Graph token request failed:",
                    error
                );


                /*
                    If Microsoft needs fresh consent or
                    another interactive check, redirect
                    the user through Microsoft and then
                    return to this PWA.
                */
                await msalInstance
                    .acquireTokenRedirect({
                        scopes: GRAPH_SCOPES,
                        account: account
                    });

                throw new Error(
                    "Microsoft authorization is required."
                );

            }

        }


        function getReceiptExtension(file) {

            /*
                Prefer the original filename extension.
                If a phone camera gives us no useful
                extension, infer one from the MIME type.
            */

            const name =
                file.name || "";

            const lastDot =
                name.lastIndexOf(".");


            if (
                lastDot > -1 &&
                lastDot < name.length - 1
            ) {

                const extension =
                    name
                        .slice(lastDot)
                        .toLowerCase()
                        .replace(
                            /[^a-z0-9.]/g,
                            ""
                        );

                if (extension) {
                    return extension;
                }

            }


            const typeMap = {
                "image/jpeg": ".jpg",
                "image/png": ".png",
                "image/heic": ".heic",
                "image/heif": ".heif",
                "image/webp": ".webp"
            };


            return typeMap[file.type] || ".jpg";

        }


        function buildReceiptFileName(file) {

            const now =
                new Date();

            const stamp = [
                now.getFullYear(),
                String(
                    now.getMonth() + 1
                ).padStart(2, "0"),
                String(
                    now.getDate()
                ).padStart(2, "0")
            ].join("-") +
            "_" +
            [
                String(
                    now.getHours()
                ).padStart(2, "0"),
                String(
                    now.getMinutes()
                ).padStart(2, "0"),
                String(
                    now.getSeconds()
                ).padStart(2, "0")
            ].join("-");


            return (
                "Receipt_" +
                stamp +
                getReceiptExtension(file)
            );

        }


        async function uploadReceiptToOneDrive(file) {

            const accessToken =
                await getGraphAccessToken();

            const fileName =
                buildReceiptFileName(file);


            /*
                We are intentionally keeping the first
                OneDrive test simple.

                Microsoft Graph will upload the receipt
                into a folder named:

                    Krissy Expense Receipts

                in the root of Krissy's OneDrive.
            */

            const folderName =
                "Krissy Expense Receipts";


            const encodedFolder =
                encodeURIComponent(folderName);

            const encodedFileName =
                encodeURIComponent(fileName);


            const uploadUrl =
                "https://graph.microsoft.com/v1.0/" +
                "me/drive/root:/" +
                encodedFolder + "/" +
                encodedFileName +
                ":/content";


            const response =
                await fetch(
                    uploadUrl,
                    {
                        method: "PUT",

                        headers: {
                            "Authorization":
                                "Bearer " +
                                accessToken,

                            "Content-Type":
                                file.type ||
                                "application/octet-stream"
                        },

                        body: file
                    }
                );


            if (!response.ok) {

                let details = "";

                try {

                    const errorBody =
                        await response.json();

                    details =
                        errorBody?.error?.message ||
                        "";

                }
                catch {
                    // Keep the normal HTTP error below.
                }


                throw new Error(
                    details ||
                    (
                        "OneDrive upload failed (" +
                        response.status +
                        ")."
                    )
                );

            }


            return await response.json();

        }


        /*
            ----------------------------------------
            DEFAULT DATE TO TODAY
            ----------------------------------------
        */

        const today = new Date();

        const localToday =
            today.getFullYear() + "-" +
            String(today.getMonth() + 1).padStart(2, "0") + "-" +
            String(today.getDate()).padStart(2, "0");

        document.getElementById("transactionDate").value =
            localToday;


        /*
            ----------------------------------------
            RECEIPT PHOTO
            ----------------------------------------
        */

        const receiptCamera =
            document.getElementById("receiptCamera");

        const receiptGallery =
            document.getElementById("receiptGallery");

        const photoPreview =
            document.getElementById("photoPreview");

        const photoStatus =
            document.getElementById("photoStatus");


        /*
            This variable holds whichever receipt
            was selected:

            - Camera photo
            OR
            - Existing photo

            Later this is the file we will upload
            directly to OneDrive.
        */

        let selectedReceiptFile = null;

        let currentPreviewURL = null;


        function handleReceiptPhoto(file) {

            if (!file) {
                return;
            }


            selectedReceiptFile = file;


            /*
                Remove the previous temporary preview
                URL if one exists.
            */

            if (currentPreviewURL) {
                URL.revokeObjectURL(currentPreviewURL);
            }


            currentPreviewURL =
                URL.createObjectURL(file);


            /*
                Camera-generated filenames can be
                unhelpful, but for now displaying the
                filename confirms that a photo exists.
            */

            photoStatus.textContent =
                "Receipt selected: " + file.name;


            photoPreview.src =
                currentPreviewURL;

            photoPreview.style.display =
                "block";
        }


        /*
            Photo taken with camera
        */

        receiptCamera.addEventListener(
            "change",
            function () {

                const file = this.files[0];

                handleReceiptPhoto(file);

            }
        );


        /*
            Existing photo selected
        */

        receiptGallery.addEventListener(
            "change",
            function () {

                const file = this.files[0];

                handleReceiptPhoto(file);

            }
        );


        /*
            ----------------------------------------
            SAVE TRANSACTION - ONEDRIVE TEST
            ----------------------------------------

            For this milestone the Save Transaction
            button does ONE real job:

            Upload the selected receipt photo to
            Krissy's OneDrive.

            We are deliberately NOT writing to Excel
            yet. Once we confirm the receipt appears
            in OneDrive, Excel is the next step.
        */

        const expenseForm =
            document.getElementById("expenseForm");

        const submitButton =
            expenseForm.querySelector(
                ".submit-button"
            );


        expenseForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                if (!msalInstance.getActiveAccount()) {

                    alert(
                        "Please sign in with Microsoft " +
                        "before saving a transaction."
                    );

                    return;

                }


                if (!selectedReceiptFile) {

                    alert(
                        "Please take or choose a receipt " +
                        "photo before saving."
                    );

                    return;

                }


                const normalButtonText =
                    "Save Transaction";


                try {

                    submitButton.disabled =
                        true;

                    submitButton.textContent =
                        "Uploading receipt...";


                    const uploadedItem =
                        await uploadReceiptToOneDrive(
                            selectedReceiptFile
                        );


                    console.log(
                        "Receipt uploaded to OneDrive:",
                        uploadedItem
                    );


                    alert(
                        "Success!

" +
                        "Receipt uploaded to OneDrive:
" +
                        uploadedItem.name +
                        "

" +
                        "Folder: Krissy Expense Receipts"
                    );


                    /*
                        Do NOT clear the form yet.
                        During this test we want the
                        entered information to remain
                        visible while we verify the
                        receipt in OneDrive.
                    */

                }
                catch (error) {

                    console.error(
                        "Save transaction failed:",
                        error
                    );


                    alert(
                        "The receipt was not uploaded.

" +
                        error.message
                    );

                }
                finally {

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        normalButtonText;

                }

            }
        );


        /*
            ----------------------------------------
            SERVICE WORKER
            ----------------------------------------
        */

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register("./service-worker.js")
                        .then(() => {

                            console.log(
                                "Service Worker registered"
                            );

                        })
                        .catch(error => {

                            console.error(
                                "Service Worker registration failed:",
                                error
                            );

                        });

                }
            );

        }

    </script>

</body>

</html>
